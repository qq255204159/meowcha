# ============================================================================
# 喵杀 (MEOWCHA) 二次开发版 · nginx 站点配置片段
# ----------------------------------------------------------------------------
# 用途：把 `next build`（output: "export"）产出的 out/ 平铺到 web root，
#       并向静态页面注入两样东西：
#         1) 配置垫片 prefill.js（首次访问写入默认 LLM/TTS 配置并锁定）
#         2) 底部「ICP备案 + 公安备案」小药丸
#
# ⚠️ 关键：BASE_PATH 必须与 next.config.ts 里的 basePath 一致（见下）。
#          next.config.ts:  basePath: "/meowcha"
#          若你改成别的前缀，请同步改这里所有 /meowcha 与下面的 $base 变量。
#
# 下面的值直接取自本项目的线上部署（/root/Nginx/conf.d/sites-common.inc 的
# `location /meowcha/` 块），可作为可运行的参考实现。
# ============================================================================

# 该站点的静态根目录（把 out/ 的内容平铺到这里）
#   nginx:  root /usr/share/nginx/html;
#   out/:   index.html / _next/ / audio/ / bgm/ / brand/ / 模型/ / 职业/ ...
# 若你的 site root 就是 `out/` 的平铺目录，直接 root 到该目录即可。

location = /meowcha { return 301 /meowcha/; }

location /meowcha/ {
    # 静态导出带 trailingSlash，未命中的路径回落到 index.html
    try_files $uri $uri/ /meowcha/index.html;

    # ── 注入 1：配置垫片（默认站长配置 + 锁定；脚本先于 Next chunk 执行）──────
    # 注入点选 <head> 之后（而非 </head> 之前），确保本脚本先于 Next 的 chunk 执行；
    # 该页面 <head> 仅出现 1 次，不会误伤内联 JSON。
    # 注意：prefill.js 内含真实 API Key，切勿提交进仓库（见 deploy/prefill.js.example）。
    sub_filter '<head>' '<head><script src="/meowcha/prefill.js"></script>';

    # ── 修正：上游静态导出把 favicon 写成根绝对路径 /brand/…（缺 basePath 前缀）
    #    → 改写为 /meowcha/brand/…（页面内有 head href + 内联 JSON icon 两处）
    sub_filter '"/brand/' '"/meowcha/brand/';

    # ── 备案药丸 ────────────────────────────────────────────────────────────
    # 现在由应用自己渲染（React 组件，服务端/客户端 DOM 一致，不再触发 React #418）；
    # 备案号通过环境变量 NEXT_PUBLIC_ICP_NUMBER / NEXT_PUBLIC_POLICE_NUMBER 注入（默认不显示）。
    # 因此这里**不再**用 sub_filter 往 </body> 注入备案信息。

    # 页面内 /brand/ 有两处、</body> 仅 1 处，故 once 必须 off 才能全改且不重复注入
    sub_filter_once off;

    # 静态导出每次重验证，保证改版后访客立即拿到新版
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

# ── 可选：自建语音（edge-tts）端点 ───────────────────────────────────────────
# 前端（静态导出无后端）本就 POST 同源 /api/tts，body {text, voiceId}，期望 audio/mpeg。
# 把该端点接到你自己的 TTS 服务（或改用环境变量 NEXT_PUBLIC_TTS_ENDPOINT 指向别处）。
#
# location = /api/tts {
#     proxy_pass              http://tts:8000;   # ← 改成你的 TTS 服务地址
#     proxy_http_version      1.1;
#     proxy_set_header        Connection "";
#     proxy_set_header        Host $host;
#     proxy_read_timeout      120s;
#     proxy_buffering         off;
#     add_header Cache-Control "no-store";
# }
#
# 说明：线上原文此处还有 auth_request /_gate（会话闸门）与 include security-headers.inc，
#       属于本站点私有保护，非本仓库所需，故示例中省略。
# ============================================================================
