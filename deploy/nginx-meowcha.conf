# ============================================================================
# 喵杀 (MEOWCHA) 二创版 · nginx 站点配置片段
# ----------------------------------------------------------------------------
# 用途：把 `next build`（output: "export"）产出的 out/ 平铺到 web root，
#       并配好 `location /meowcha/` 的静态回落 + 两个可选反代（联机房间 / 语音）。
#
# ⚠️ BASE_PATH 必须与 next.config.ts 的 basePath 一致（默认 /meowcha）。
#
# 💡 只想最快跑起来？看 `deploy/docker-compose.yml` —— 那是「站点 + 房间 + 语音」
#    一键起全套的编排；本文件是「自己已有 nginx、手动接上」时用的参考实现。
# ============================================================================

# 该站点的静态根目录（把 out/ 的内容平铺到这里）
#   nginx:  root /usr/share/nginx/html;
#   out/:   index.html / _next/ / audio/ / bgm/ / brand/ / 模型/ ...
# 若你的 site root 就是 `out/` 的平铺目录，直接 root 到该目录即可。

location = /meowcha { return 301 /meowcha/; }

location /meowcha/ {
    # 静态导出带 trailingSlash：未命中的路径回落到 index.html
    try_files $uri $uri/ /meowcha/index.html;
    # 每次重验证：改版后访客立即拿到新版
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

# ── 联机房间服务（可选）──────────────────────────────────────────────────────
# 前端请求 /meowcha/mp/rooms… → 上游 /rooms…（结尾的 "/" 表示剥掉 /meowcha/mp 前缀）
location /meowcha/mp/ {
    proxy_pass              http://meowroom:8000/;   # ← 改成你的房间服务地址
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    # ⚠️ 下面三条是 SSE 的**必需项**，缺了会表现成「连上了，却收不到推送」：
    proxy_set_header        Connection "";   # SSE 是长连接，必须保持到上游
    proxy_buffering         off;             # 不关缓冲 → 变更信号会被 nginx 攒着不发
    proxy_cache             off;
    proxy_read_timeout      3600s;           # 默认 30s 会掐断事件流
    proxy_send_timeout      3600s;
    add_header              Cache-Control "no-store";
}

# ── 语音合成（可选）──────────────────────────────────────────────────────────
# 前端固定 POST 同源 /api/tts；`proxy_pass` 结尾的 "/" 会把 /api/tts 前缀剥掉，
# 所以上游服务把主路由放在 "/"（仓库附带的 deploy/tts 就是这样）。
location = /api/tts {
    proxy_pass              http://tts:8000/;        # ← 改成你的语音服务地址
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_read_timeout      120s;
    proxy_buffering         off;
    add_header              Cache-Control "no-store";
}

# 说明：`prefill.js` 由页面自带的 <script src="/meowcha/prefill.js"> 加载 ——
#       你只要把文件放进部署目录即可，**不需要**任何 sub_filter 注入。
# 说明：线上原文此处还有 auth_request /_gate（会话闸门）与 include security-headers.inc，
#       属于本站点私有保护，非本仓库所需，故示例中省略。
# ============================================================================
