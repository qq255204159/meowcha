# ============================================================================
# 喵杀（MEOWCHA）· 一键部署用的最小 nginx 站点配置
# ----------------------------------------------------------------------------
# 用途：作为 meowcha 容器的 /etc/nginx/conf.d/default.conf（见 docker-compose.yml）。
#   · 静态站点挂在 /meowcha/（与 next.config.ts 的 basePath 一致）；
#   · /meowcha/mp/ 反代到内部 meowroom 服务（REST + SSE）；
#   · /api/tts 反代到内部 tts 服务。
# ⚠️ 这只是「本机一键试用」的最小配置：正式上线请自行补 TLS、访问控制 / 会话保护、
#    限流等（本文件刻意不做任何鉴权）。
# ============================================================================
server {
    listen 80;
    server_name _;

    # 静态导出的站点文件（镜像里 nginx 的默认站点根）
    root /usr/share/nginx/html;
    index index.html;

    # 子路径补斜杠
    location = /meowcha { return 301 /meowcha/; }

    # 静态站点：未命中的路径回落到 /meowcha/index.html（trailingSlash: true 的 SPA 兜底）
    # 注：prefill.js 由页面自带的 <script src="/meowcha/prefill.js"> 加载，无需 sub_filter 注入。
    location /meowcha/ {
        try_files $uri $uri/ /meowcha/index.html;
    }

    # 联机房间服务：前端请求 /meowcha/mp/rooms... → 上游 /rooms...
    location /meowcha/mp/ {
        proxy_pass              http://meowroom:8000/;
        proxy_http_version      1.1;
        # SSE 长连接必需：清空 Connection，避免 nginx 用短连接掐断事件流
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        # SSE 必需：关闭响应缓冲，否则事件会被 nginx 攒着不下发
        proxy_buffering         off;
        proxy_cache             off;
        add_header              X-Accel-Buffering no;
        # 事件流是长连接，读超时要放长（否则会被 60s 默认值掐断）
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        add_header              Cache-Control "no-store";
    }

    # 语音合成：前端固定 POST 同源 /api/tts
    # proxy_pass 带 URI "/" → /api/tts 被改写成 /，对应 tts 服务的 POST / 主路由
    location = /api/tts {
        proxy_pass              http://tts:8000/;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        # 音频是流式返回，关缓冲可尽早开始播放
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      120s;
        add_header              Cache-Control "no-store";
    }
}
